name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            IFS=/ read -r os arch <<<"$target"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build ./cmd/hintai
          done
