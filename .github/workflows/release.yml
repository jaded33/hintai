name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            IFS=/ read -r os arch <<<"$target"
            name="hintai_${VERSION}_${os}_${arch}"
            mkdir -p "dist/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -ldflags "-s -w -X github.com/jaded33/hintai/internal/cli.version=$VERSION" \
              -o "dist/$name/hintai" ./cmd/hintai
            cp README.md LICENSE NOTICE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd "dist/$name" && zip -q -r "../$name.zip" .)
            rm -rf "dist/$name"
          done
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
