# Copy to ~/.config/hintai/config.yaml or run hintai configure.
# Prefer provider-specific API key environment variables. The legacy api_key
# field remains supported as a fallback.
provider: lmstudio
base_url: http://localhost:1234
default_model: your-local-model-id
reuse_loaded_model: true
disable_thinking: true

# provider: ollama
# base_url: http://localhost:11434
# default_model: your-local-model-id

# Cloud provider defaults can be changed for compatible gateways.
# Keep the provider API key in its environment variable, or use api_key below.
# provider: openai # or anthropic, gemini, openrouter, grok
# base_url: https://api.openai.com/v1
# model: your-current-model-id
# api_key: optional fallback; prefer an environment variable

# Optional overrides
# shell: zsh
# history_file: ~/path/to/history
